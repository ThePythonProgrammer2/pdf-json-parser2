apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-json-parser2
  labels:
    app: pdf-json-parser2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdf-json-parser2
  template:
    metadata:
      labels:
        app: pdf-json-parser2
    spec:
      containers:
        - name: api
          image: python:3.14-slim
          command: ["sh", "-lc", "pip install -r requirements.txt && PYTHONPATH=. uvicorn app:app --host 0.0.0.0 --port 8000"]
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
        - name: gateway
          image: golang:1.22-alpine
          command: ["sh", "-lc", "go run ./cmd/gateway"]
          ports:
            - containerPort: 8080
          env:
            - name: PYTHON_URL
              value: http://localhost:8000
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-json-parser2
spec:
  selector:
    app: pdf-json-parser2
  ports:
    - name: http
      port: 80
      targetPort: 8080
