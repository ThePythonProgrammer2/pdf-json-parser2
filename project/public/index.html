<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocAI - Enterprise PDF & Document AI Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [jsonResult, setJsonResult] = useState(null);
      const [activeTab, setActiveTab] = useState('all');
      const [hoveredNodeId, setHoveredNodeId] = useState(null);
      const [copied, setCopied] = useState(false);
      const fileInputRef = useRef(null);

      const handleFileUpload = async (e) => {
        const uploadedFile = e.target.files[0];
        if (!uploadedFile) return;

        setFile(uploadedFile);
        setLoading(true);

        const formData = new FormData();
        // Field name matches 'pdf' in upload.single('pdf') in server/index.js
        formData.append('pdf', uploadedFile);

        try {
          // Pointing directly to /api/parse
          const res = await fetch('/api/parse', { 
            method: 'POST', 
            body: formData 
          });

          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`Server returned HTTP ${res.status}`);
          }

          const responseData = await res.json();
          if (responseData.success) {
            setJsonResult(responseData.data);
          } else {
            alert('Parsing error: ' + (responseData.error || 'Unknown error'));
          }
        } catch (err) {
          console.error('File processing error:', err);
          alert(`Network request failed: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(JSON.stringify(jsonResult, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const downloadJson = () => {
        const blob = new Blob([JSON.stringify(jsonResult, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `parsed_${file?.name.replace('.pdf', '') || 'document'}.json`;
        a.click();
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navbar */}
          <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-6 py-3 flex items-center justify-between sticky top-0 z-50">
            <div className="flex items-center space-x-3">
              <div className="p-2 bg-indigo-600 rounded-lg text-white font-bold shadow-lg shadow-indigo-500/30">
                ⚡
              </div>
              <div>
                <h1 className="text-base font-bold tracking-tight">DocAI Parsing Engine</h1>
                <p className="text-xs text-slate-400">Enterprise Spatial PDF Transformer</p>
              </div>
            </div>

            {jsonResult && (
              <div className="flex items-center space-x-3">
                <button 
                  onClick={copyToClipboard} 
                  className="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition"
                >
                  {copied ? '✓ Copied' : 'Copy JSON'}
                </button>
                <button 
                  onClick={downloadJson} 
                  className="px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-500/20 transition"
                >
                  Download Schema
                </button>
              </div>
            )}
          </header>

          {/* Main Layout Workspace */}
          <main className="flex-1 flex flex-col p-6 max-w-[1800px] w-full mx-auto space-y-6">
            {!jsonResult && !loading && (
              <div 
                onClick={() => fileInputRef.current?.click()}
                className="border-2 border-dashed border-slate-800 bg-slate-900/30 hover:border-indigo-500/50 rounded-2xl p-16 flex flex-col items-center justify-center cursor-pointer transition-all my-auto text-center"
              >
                <input ref={fileInputRef} type="file" accept=".pdf" className="hidden" onChange={handleFileUpload} />
                <div className="p-4 bg-indigo-500/10 rounded-full text-indigo-400 mb-4 text-3xl">
                  📁
                </div>
                <h3 className="text-lg font-semibold">Drop PDF Document Here</h3>
                <p className="text-sm text-slate-400 mt-1">Extract spatial bounding boxes, tabular grids, typography, and interactive elements</p>
              </div>
            )}

            {loading && (
              <div className="flex flex-col items-center justify-center my-auto space-y-4">
                <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="font-semibold text-slate-300">Executing Spatial Layout Engine...</p>
              </div>
            )}

            {jsonResult && (
              <div className="grid grid-cols-12 gap-6 flex-1">
                {/* Visual Spatial Canvas */}
                <div className="col-span-6 border border-slate-800 bg-slate-900/40 rounded-xl p-4 flex flex-col h-[82vh] overflow-hidden">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                      Visual Coordinate Space
                    </span>
                    <span className="text-xs px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 font-mono">
                      {jsonResult.pages?.length || 1} Pages
                    </span>
                  </div>

                  <div className="flex-1 overflow-y-auto mt-4 space-y-6 pr-2">
                    {(jsonResult.pages || []).map((page) => (
                      <div 
                        key={page.pageNumber} 
                        className="relative border border-slate-700/50 rounded-lg bg-slate-950 p-4 min-h-[500px]"
                        style={{ aspectRatio: `${page.dimensions?.width || 612} / ${page.dimensions?.height || 792}` }}
                      >
                        {(page.elements || []).map((el) => {
                          const isHovered = hoveredNodeId === el.id;
                          return (
                            <div
                              key={el.id}
                              onMouseEnter={() => setHoveredNodeId(el.id)}
                              onMouseLeave={() => setHoveredNodeId(null)}
                              className={`absolute text-[10px] p-0.5 border cursor-pointer transition-all ${
                                isHovered 
                                  ? 'border-indigo-400 bg-indigo-500/30 ring-2 ring-indigo-400 z-30' 
                                  : 'border-indigo-500/20 bg-indigo-500/5 hover:border-indigo-400/60'
                              }`}
                              style={{
                                left: `${(el.bbox.x / (page.dimensions?.width || 612)) * 100}%`,
                                top: `${(el.bbox.y / (page.dimensions?.height || 792)) * 100}%`,
                                color: el.style?.color || '#cbd5e1'
                              }}
                            >
                              {el.text}
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                </div>

                {/* JSON Inspector Window */}
                <div className="col-span-6 border border-slate-800 bg-slate-900/40 rounded-xl p-4 flex flex-col h-[82vh] overflow-hidden">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                      Structured Output JSON
                    </span>
                    <div className="flex space-x-1 bg-slate-800/60 p-1 rounded-lg">
                      {['all', 'tables', 'entities'].map((tab) => (
                        <button
                          key={tab}
                          onClick={() => setActiveTab(tab)}
                          className={`text-[11px] font-medium px-2.5 py-1 rounded-md capitalize transition ${
                            activeTab === tab ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'
                          }`}
                        >
                          {tab}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto mt-4 font-mono text-xs space-y-2 pr-2">
                    <pre className="text-slate-300">
                      {JSON.stringify(jsonResult, null, 2)}
                    </pre>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
