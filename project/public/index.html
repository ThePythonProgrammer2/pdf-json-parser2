<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to JSON Parser Engine</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --code-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    header { text-align: center; }
    header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    header p { color: var(--muted); }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    
    .upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 2rem; text-align: center; background: #fafafa; }
    .upload-area.active { border-color: var(--accent); background: #eff6ff; }
    
    .file-select-btn { display: inline-block; background: var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 0.5rem; }
    .file-select-btn:hover { background: #cbd5e1; }
    
    .btn-submit { background: var(--accent); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 1rem; font-size: 1rem; }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    #fileInput { display: none; }
    #selectedFileName { font-weight: 600; color: var(--accent); margin-top: 0.5rem; font-size: 0.95rem; }
    
    pre { background: var(--code-bg); color: #f8fafc; padding: 1rem; border-radius: 6px; overflow-x: auto; max-height: 450px; font-size: 0.85rem; line-height: 1.4; }
    .status { margin-top: 0.5rem; font-weight: 600; font-size: 0.9rem; }
    .status.error { color: #dc2626; }
    .status.success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>PDF to JSON Parser</h1>
      <p>Upload a PDF document to extract structured JSON data.</p>
    </header>

    <div class="card">
      <div class="upload-area" id="dropArea">
        <p><strong>Drag & Drop PDF file here</strong></p>
        <p style="color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem;">OR</p>
        
        <label for="fileInput" class="file-select-btn">Choose File from Computer</label>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" />
        
        <div id="selectedFileName"></div>
      </div>

      <button type="button" class="btn-submit" id="parseBtn" disabled>Parse PDF Document</button>
      <div id="statusText" class="status"></div>
    </div>

    <div class="card">
      <h3>Output JSON:</h3>
      <pre id="jsonOutput">// Parsing results will appear here...</pre>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const parseBtn = document.getElementById('parseBtn');
    const fileNameDiv = document.getElementById('selectedFileName');
    const statusText = document.getElementById('statusText');
    const jsonOutput = document.getElementById('jsonOutput');
    const dropArea = document.getElementById('dropArea');

    let currentFile = null;

    // Handle File Selection
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        setFile(e.target.files[0]);
      }
    });

    // Drag and drop setup
    ['dragenter', 'dragover'].forEach(name => {
      dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.classList.add('active'); });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.classList.remove('active'); });
    });

    dropArea.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length > 0) {
        setFile(e.dataTransfer.files[0]);
      }
    });

    function setFile(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        showStatus('Error: Selected file is not a PDF.', 'error');
        currentFile = null;
        parseBtn.disabled = true;
        fileNameDiv.textContent = '';
        return;
      }
      currentFile = file;
      fileNameDiv.textContent = `Selected: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
      parseBtn.disabled = false;
      showStatus('', '');
    }

    function showStatus(msg, type) {
      statusText.textContent = msg;
      statusText.className = `status ${type || ''}`;
    }

    // Trigger API parse on button click
    parseBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      const formData = new FormData();
      formData.append('file', currentFile);

      parseBtn.disabled = true;
      parseBtn.textContent = 'Parsing...';
      showStatus('Uploading and parsing PDF...', '');
      jsonOutput.textContent = '// Parsing in progress, please wait...';

      try {
        const response = await fetch('/api/parse', {
          method: 'POST',
          body: formData
        });

        const responseData = await response.json();

        if (!response.ok) {
          throw new Error(responseData.message || `Server responded with status ${response.status}`);
        }

        jsonOutput.textContent = JSON.stringify(responseData, null, 2);
        showStatus('Parsing completed successfully!', 'success');
      } catch (err) {
        console.error('API Request Failed:', err);
        jsonOutput.textContent = JSON.stringify({ error: true, details: err.message }, null, 2);
        showStatus(`Failed: ${err.message}`, 'error');
      } finally {
        parseBtn.disabled = false;
        parseBtn.textContent = 'Parse PDF Document';
      }
    });
  </script>
</body>
</html>
