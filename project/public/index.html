<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to JSON Parser</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ccc; padding: 2rem; border-radius: 8px; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; max-height: 400px; }
    button { background: #0066cc; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Upload PDF for Parsing</h2>
    <form id="uploadForm">
      <input type="file" id="pdfFile" accept="application/pdf" required />
      <button type="submit">Convert to JSON</button>
    </form>
    <h3>Result:</h3>
    <pre id="output">Upload a file to see JSON output...</pre>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('pdfFile');
      const output = document.getElementById('output');

      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      output.textContent = 'Parsing...';

      try {
        const response = await fetch('/api/parse', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        output.textContent = JSON.stringify(result, null, 2);
      } catch (err) {
        output.textContent = 'Error parsing PDF file.';
      }
    });
  </script>
</body>
</html>
